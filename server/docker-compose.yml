services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustshare}
      POSTGRES_USER: ${POSTGRES_USER:-trustshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustshare}
    ports:
      - "5432:5432"
    volumes:
      - trustshare_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustshare} -d ${POSTGRES_DB:-trustshare}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trustshare}:${POSTGRES_PASSWORD:-trustshare}@database:5432/${POSTGRES_DB:-trustshare}
      REQUIRE_POSTGRESQL: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  trustshare_postgres: